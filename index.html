
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연세대학교 EMBA 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #eef3f9 0%, #f8fafc 100%);
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #002b5c 0%, #003876 45%, #1d4ed8 100%);
            padding: 18px 40px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: #fff;
            border-bottom: 3px solid #c5a46d;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }

        header img {
            height: 48px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            padding: 5px;
        }

        header span {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .container {
            max-width: 1050px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255,255,255,0.92);
            border-radius: 18px;
            padding: 22px 28px;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 10px 28px rgba(15,23,42,0.08);
        }

        .card h2 {
            font-size: 19px;
            color: #0f172a;
            margin: 0 0 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
        }

        .card h2 i { color: #2563eb; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 800;
            font-size: 20px;
            transition: 0.25s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .link-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top right, rgba(255,255,255,0.2), transparent);
            border-radius: 11px;
            pointer-events: none;
        }

        .link-btn:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .link-btn span {
            position: relative;
            z-index: 2;
        }

        .btn-royal {
            background: linear-gradient(135deg, #002266 0%, #004dc7 35%, #9cc6ff 40%, #00308a 60%, #001f4d 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -6px 15px rgba(0,0,0,0.15), 0 8px 18px rgba(0,82,217,0.32);
        }

        .btn-slate {
            background: linear-gradient(135deg, #3a006d 0%, #a44dff 35%, #edccff 40%, #611bbe 60%, #1e0038 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -6px 15px rgba(0,0,0,0.15), 0 8px 18px rgba(123,34,217,0.3);
        }

        .btn-dark {
            background: linear-gradient(135deg, #004c38 0%, #00a379 35%, #a6f6df 40%, #00664d 60%, #002e1f 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -6px 15px rgba(0,0,0,0.15), 0 8px 18px rgba(0,143,104,0.3);
        }

        /* 17기 추억 공유 특별 영역 */

        .memory-card {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            margin-bottom: 25px;
            padding: 28px 32px 32px;
            background:
                radial-gradient(ellipse at 15% 80%, rgba(255,197,113,0.55), transparent 48%),
                radial-gradient(ellipse at 85% 12%, rgba(255,164,202,0.4), transparent 48%),
                linear-gradient(125deg, #fff3d8 0%, #fff9f5 48%, #ffe5ed 100%);
            border: 2px solid #e4bd78;
            box-shadow: 0 12px 32px rgba(195,125,76,0.18);
        }

        .memory-card::before {
            content: "";
            position: absolute;
            top: -80px;
            right: -60px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,201,87,0.25), transparent 70%);
            pointer-events: none;
        }

        .memory-heading {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(115deg, #082b60, #2458a1, #102c58);
            border: 1px solid #cfaa65;
            box-shadow: 0 5px 13px rgba(12,36,85,0.18);
            font-size: 21px;
            font-weight: 800;
        }

        .memory-heading i {
            color: #f9d685;
        }

        .memory-content {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 25px;
            align-items: center;
            min-height: 235px;
            padding-top: 18px;
        }

        .memory-visual {
            position: relative;
            height: 210px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .polaroid {
            position: absolute;
            width: 113px;
            height: 140px;
            padding: 8px 8px 23px;
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 9px 17px rgba(47,43,42,0.23);
        }

        .polaroid .photo {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.92);
            font-size: 41px;
        }

        .photo-one {
            left: 8%;
            top: 30px;
            transform: rotate(-16deg);
        }

        .photo-one .photo {
            background: linear-gradient(140deg, #576ab6, #e8a1a2, #f9c37d);
        }

        .photo-two {
            right: 12%;
            top: 38px;
            transform: rotate(12deg);
        }

        .photo-two .photo {
            background: linear-gradient(135deg, #397f9c, #73b7ad, #edbd78);
        }

        .camera-art {
            position: relative;
            z-index: 2;
            font-size: 105px;
            color: #233c59;
            filter: drop-shadow(6px 9px 5px rgba(31,41,55,0.22));
        }

        .video-art {
            position: absolute;
            right: 8%;
            bottom: 2px;
            z-index: 3;
            width: 76px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #fff;
            border-radius: 13px;
            background: linear-gradient(135deg, #bd56d6, #f17a9b);
            border: 3px solid white;
            box-shadow: 0 6px 14px rgba(100,45,92,0.2);
            transform: rotate(8deg);
        }

        .sparkle {
            position: absolute;
            color: #e4a33a;
            font-size: 23px;
        }

        .sparkle.one { top: 4px; left: 30%; }
        .sparkle.two { top: 14px; right: 14%; }
        .sparkle.three { bottom: 10px; left: 17%; }

        .memory-info {
            text-align: center;
            position: relative;
            z-index: 4;
        }

        .memory-title {
            margin: 0 0 12px;
            color: #233b62;
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.4;
        }

        .memory-description {
            color: #6b5960;
            font-size: 15px;
            line-height: 1.9;
            margin: 0 0 24px;
        }

        .upload-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            width: min(100%, 365px);
            padding: 19px 22px;
            border-radius: 17px;
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: 800;
            text-shadow: 1px 2px 3px rgba(108,29,58,0.38);
            background: linear-gradient(
                115deg,
                #a91b83 0%,
                #eb439e 26%,
                #ff91a2 43%,
                #ffac58 65%,
                #e57b1c 100%
            );
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow:
                inset 0 3px 4px rgba(255,255,255,0.55),
                inset 0 -5px 8px rgba(125,38,57,0.24),
                0 9px 19px rgba(218,71,117,0.35);
            transition: 0.25s ease;
        }

        .upload-btn:hover {
            transform: translateY(-4px);
            filter: brightness(1.07);
            box-shadow: 0 13px 25px rgba(218,71,117,0.45);
        }

        .upload-btn i {
            font-size: 26px;
        }

        @media (max-width: 768px) {
            header { padding: 16px 20px; }
            header span { font-size: 20px; }

            .btn-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }

            .memory-card {
                padding: 20px 16px 26px;
            }

            .memory-heading {
                font-size: 19px;
                padding: 10px 16px;
            }

            .memory-content {
                grid-template-columns: 1fr;
                gap: 5px;
                padding-top: 5px;
            }

            .memory-visual {
                height: 190px;
                max-width: 360px;
                width: 100%;
                margin: 0 auto;
            }

            .memory-title {
                font-size: 24px;
            }

            .memory-description {
                font-size: 14px;
            }

            .upload-btn {
                font-size: 20px;
                padding: 17px 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <img src="yonsei.jpg" alt="연세대 로고">
    <span>연세대학교 EMBA 대시보드</span>
</header>

<div class="container">

    <!-- 학교 서비스 -->
    <div class="card">
        <h2><i class="fa-solid fa-school"></i> 학교 서비스</h2>
        <div class="btn-grid">
            <a href="https://portal.yonsei.ac.kr/" target="_blank" rel="noopener noreferrer" class="link-btn btn-royal">
                <span>연세대 포털</span>
            </a>
            <a href="https://ys.learnus.org/" target="_blank" rel="noopener noreferrer" class="link-btn btn-royal">
                <span>LearnUs</span>
            </a>
            <a href="https://yonseicoop.com/" target="_blank" rel="noopener noreferrer" class="link-btn btn-royal">
                <span>굿즈 샵</span>
            </a>
        </div>
    </div>

    <!-- 17기 전용 -->
    <div class="card">
        <h2><i class="fa-solid fa-star"></i> 17기 전용</h2>
        <div class="btn-grid">
            <a href="https://willryugo.github.io/EMBA17/" target="_blank" rel="noopener noreferrer" class="link-btn btn-slate">
                <span>학술운영보드</span>
            </a>
            <a href="https://willryugo.github.io/EMBA17/members_private.html" target="_blank" rel="noopener noreferrer" class="link-btn btn-slate">
                <span>16·17기 명단 (핀:2580)</span>
            </a>
            <a href="https://docs.google.com/spreadsheets/d/1wpRfh62ZCXjM1MDO91RZiyOuP1kpKQBo1kjzyvrIGMg/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer" class="link-btn btn-slate">
                <span>원우회비조회</span>
            </a>
            <a href="https://www.dualbrain.studio/magazine" target="_blank" rel="noopener noreferrer" class="link-btn btn-slate">
                <span>DualBrain (핀:2580)</span>
            </a>
        </div>
    </div>

    <!-- 동문 네트워크 -->
    <div class="card">
        <h2><i class="fa-solid fa-crown"></i> 동문 네트워크</h2>
        <div class="btn-grid">
            <a href="https://yonsei-emba.co.kr/" target="_blank" rel="noopener noreferrer" class="link-btn btn-dark">
                <span>EMBA 동문</span>
            </a>
            <a href="https://www.yonseialumni.net/" target="_blank" rel="noopener noreferrer" class="link-btn btn-dark">
                <span>총동문회</span>
            </a>
        </div>
    </div>

    <!-- 새로 추가한 17기 추억 공유 -->
    <section class="memory-card">

        <div class="memory-heading">
            <i class="fa-solid fa-images"></i>
            <span>17기 추억 공유</span>
        </div>

        <div class="memory-content">

            <div class="memory-visual" aria-hidden="true">

                <div class="polaroid photo-one">
                    <div class="photo">
                        <i class="fa-solid fa-people-group"></i>
                    </div>
                </div>

                <div class="polaroid photo-two">
                    <div class="photo">
                        <i class="fa-solid fa-mountain-sun"></i>
                    </div>
                </div>

                <i class="fa-solid fa-camera-retro camera-art"></i>

                <div class="video-art">
                    <i class="fa-solid fa-play"></i>
                </div>

                <i class="fa-solid fa-star sparkle one"></i>
                <i class="fa-solid fa-star sparkle two"></i>
                <i class="fa-solid fa-star sparkle three"></i>

            </div>

            <div class="memory-info">

                <h2 class="memory-title">
                    함께한 순간을 남겨주세요
                </h2>

                <p class="memory-description">
                    직접 찍은 사진과 영상을 올려주세요.<br>
                    우리의 소중한 추억을 함께 나눠요.
                </p>

                <a
                    href="https://drive.google.com/drive/folders/1HVLuASUzvOKL4t5-RquGLd2BmSXVdXqO"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="upload-btn"
                >
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>사진·영상 업로드</span>
                    <i class="fa-solid fa-chevron-right" style="font-size:17px;"></i>
                </a>

            </div>

        </div>

    </section>

</div>

</body>
</html>
