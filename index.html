
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연세대학교 EMBA 대시보드</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, #eef3f9, #f8fafc);
    color: #1e293b;
}

/* 상단 헤더 */

header {
    background: linear-gradient(135deg,
        #002b5c 0%,
        #003876 45%,
        #1d4ed8 100%);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    gap: 18px;
    color: white;
    border-bottom: 3px solid #c5a46d;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
}

header img {
    height: 48px;
    background: rgba(255,255,255,0.95);
    border-radius: 50%;
    padding: 5px;
}

header span {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.container {
    max-width: 1050px;
    margin: 20px auto;
    padding: 0 20px;
}

/* 일반 카드 */

.card {
    background: rgba(255,255,255,0.95);
    border-radius: 18px;
    padding: 22px 28px;
    margin-bottom: 18px;
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 10px 28px rgba(15,23,42,0.08);
}

.card h2 {
    font-size: 19px;
    color: #0f172a;
    margin: 0 0 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
}

.card h2 i {
    color: #2563eb;
}

.btn-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

/* 기존 버튼 */

.link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 20px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: 800;
    font-size: 20px;
    transition: 0.25s ease;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
    text-align: center;
}

.link-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top right,
        rgba(255,255,255,0.2),
        transparent);
    border-radius: 11px;
    pointer-events: none;
}

.link-btn:hover {
    transform: translateY(-3px) scale(1.02);
    filter: brightness(1.15);
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.link-btn span {
    position: relative;
    z-index: 2;
}

.btn-royal {
    background: linear-gradient(135deg,
        #002266 0%,
        #004dc7 35%,
        #9cc6ff 40%,
        #00308a 60%,
        #001f4d 100%);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.4),
        inset 0 -6px 15px rgba(0,0,0,0.15),
        0 8px 18px rgba(0,82,217,0.32);
}

.btn-slate {
    background: linear-gradient(135deg,
        #3a006d 0%,
        #a44dff 35%,
        #edccff 40%,
        #611bbe 60%,
        #1e0038 100%);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.4),
        inset 0 -6px 15px rgba(0,0,0,0.15),
        0 8px 18px rgba(123,34,217,0.3);
}

.btn-dark {
    background: linear-gradient(135deg,
        #004c38 0%,
        #00a379 35%,
        #a6f6df 40%,
        #00664d 60%,
        #002e1f 100%);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.4),
        inset 0 -6px 15px rgba(0,0,0,0.15),
        0 8px 18px rgba(0,143,104,0.3);
}

/* 17기 추억 공유 - 최상단 특별 영역 */

.memory-banner {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 22px;
    margin-bottom: 18px;
    background: linear-gradient(110deg,
        #ffffff 0%,
        #fffdf9 55%,
        #fff9fc 100%);
    border: 2px solid #e8b55d;
    border-radius: 18px;
    box-shadow: 0 7px 20px rgba(164,112,42,0.13);
}

/* 왼쪽 제목 */

.memory-title {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
    font-size: 22px;
    font-weight: 800;
    color: #092b63;
    white-space: nowrap;
}

.memory-title i {
    color: #d7298e;
    font-size: 25px;
}

/* 제목 옆 구분선 */

.memory-divider {
    width: 2px;
    height: 42px;
    background: #d9dee8;
    flex-shrink: 0;
}

/* 중앙 설명 */

.memory-description {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 700;
    color: #334766;
    line-height: 1.6;
}

/* 가장 오른쪽 업로드 버튼 */

.upload-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex: 0 0 auto;
    padding: 16px 25px;
    border-radius: 50px;
    text-decoration: none;
    color: white;
    font-size: 19px;
    font-weight: 800;
    white-space: nowrap;
    text-shadow: 1px 2px 3px rgba(100,30,60,0.4);
    background: linear-gradient(110deg,
        #d40091 0%,
        #ef319e 32%,
        #ff6481 56%,
        #ff9a20 100%);
    border: 2px solid rgba(255,255,255,0.8);
    box-shadow:
        inset 0 3px 4px rgba(255,255,255,0.4),
        inset 0 -5px 7px rgba(120,25,55,0.18),
        0 7px 17px rgba(214,46,111,0.32);
    transition: 0.25s;
}

.upload-btn:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
    box-shadow: 0 10px 22px rgba(214,46,111,0.45);
}

.upload-btn i {
    font-size: 22px;
}

.upload-btn .arrow {
    font-size: 14px;
}

/* 스마트폰 대응 */

@media (max-width: 768px) {

    header {
        padding: 14px 15px;
        gap: 10px;
    }

    header img {
        height: 40px;
    }

    header span {
        font-size: 19px;
    }

    .container {
        margin: 12px auto;
        padding: 0 12px;
    }

    .card {
        padding: 18px;
        margin-bottom: 12px;
    }

    .btn-grid {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .link-btn {
        font-size: 18px;
        padding: 13px;
    }

    /* 스마트폰 추억 공유 */

    .memory-banner {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 10px;
        padding: 12px;
        margin-bottom: 12px;
        align-items: center;
    }

    .memory-title {
        grid-column: 1;
        font-size: 17px;
        gap: 6px;
    }

    .memory-title i {
        font-size: 19px;
    }

    .memory-divider {
        display: none;
    }

    .memory-description {
        grid-column: 1;
        font-size: 11px;
        font-weight: 400;
        line-height: 1.45;
    }

    .upload-btn {
        grid-column: 2;
        grid-row: 1 / 3;
        padding: 13px 12px;
        gap: 5px;
        font-size: 12px;
    }

    .upload-btn i {
        font-size: 15px;
    }

    .upload-btn .arrow {
        font-size: 10px;
    }
}

</style>
</head>

<body>

<header>
    <img src="yonsei.jpg" alt="연세대 로고">
    <span>연세대학교 EMBA 대시보드</span>
</header>

<div class="container">

    <!-- 17기 추억 공유 : 최상단 -->

    <section class="memory-banner">

        <div class="memory-title">
            <i class="fa-solid fa-camera"></i>
            <span>17기 추억 공유</span>
        </div>

        <div class="memory-divider"></div>

        <div class="memory-description">
            직접 찍은 사진과 영상을 올려주세요.<br>
            우리의 소중한 추억을 함께 나눠요!
        </div>

        <a
            href="https://drive.google.com/drive/folders/1HVLuASUzvOKL4t5-RquGLd2BmSXVdXqO"
            target="_blank"
            rel="noopener noreferrer"
            class="upload-btn"
        >
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>사진·영상 업로드</span>
            <i class="fa-solid fa-chevron-right arrow"></i>
        </a>

    </section>

    <!-- 학교 서비스 -->

    <div class="card">
        <h2>
            <i class="fa-solid fa-school"></i>
            학교 서비스
        </h2>

        <div class="btn-grid">

            <a href="https://portal.yonsei.ac.kr/"
               target="_blank"
               rel="noopener noreferrer"
               class="link-btn btn-royal">
                <span>연세대 포털</span>
            </a>

            <a href="https://ys.learnus.org/"
               target="_blank"
               rel="noopener noreferrer"
               class="link-btn btn-royal">
                <span>LearnUs</span>
            </a>

            <a href="https://yonseicoop.com/"
               target="_blank"
               rel="noopener noreferrer"
               class="link-btn btn-royal">
                <span>굿즈 샵</span>
            </a>

        </div>
    </div>

    <!-- 17기 전용 -->

    <div class="card">
        <h2>
            <i class="fa-solid fa-star"></i>
            17기 전용
        </h2>

        <div class="btn-grid">

            <a href="https://willryugo.github.io/EMBA17/"
               target="_blank"
               rel="noopener noreferrer"
               class="link-btn btn-slate">
                <span>학술운영보드</span>
            </a>

            <a href="https://willryugo.github.io/EMBA17/members_private.html"
               target="_blank"
               rel="noopener noreferrer"
               class="link-btn btn-slate">
                <span>16·17기 명단 (핀:2580)</span>
            </a>

            <a href="https://docs.google.com/spreadsheets/d/1wpRfh62ZCXjM1MDO91RZiyOuP1kpKQBo1kjzyvrIGMg/edit?gid=0#gid=0"
               target="_blank"
               rel="noopener noreferrer"
               class="link-btn btn-slate">
                <span>원우회비조회</span>
            </a>

            <a href="https://www.dualbrain.studio/magazine"
               target="_blank"
               rel="noopener noreferrer"
               class="link-btn btn-slate">
                <span>DualBrain (핀:2580)</span>
            </a>

        </div>
    </div>

    <!-- 동문 네트워크 -->

    <div class="card">
        <h2>
            <i class="fa-solid fa-crown"></i>
            동문 네트워크
        </h2>

        <div class="btn-grid">

            <a href="https://yonsei-emba.co.kr/"
               target="_blank"
               rel="noopener noreferrer"
               class="link-btn btn-dark">
                <span>EMBA 동문</span>
            </a>

            <a href="https://www.yonseialumni.net/"
               target="_blank"
               rel="noopener noreferrer"
               class="link-btn btn-dark">
                <span>총동문회</span>
            </a>

        </div>
    </div>

</div>

</body>
</html>
